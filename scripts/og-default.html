<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0b0b0d; color: #edeae3; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; padding: 56px 64px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid rgba(237, 234, 227, 0.2); font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(237, 234, 227, 0.62); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .dot { width: 14px; height: 14px; background: #f2c14e; }
  h1 { margin-top: auto; font-stretch: 62%; font-weight: 400; text-transform: uppercase; font-size: 216px; line-height: 0.87; letter-spacing: -0.01em; }
  h1 span { color: #f2c14e; }
  p { margin-top: 26px; font-size: 30px; color: rgba(237, 234, 227, 0.62); }
</style>
</head>
<body>
  <div class="top"><div class="brand"><span class="dot"></span>irdizeneli.dev</div><div>typed by hand</div></div>
  <h1>vibing<br />with <span>irdi</span></h1>
  <p>engineering, mostly. vibes, always.</p>
</body>
</html>
