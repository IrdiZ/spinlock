<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Default share card, 1200x630. The whole painting on the left (it is square), two lines of
     text on the right. Same look as the site and the X banner. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 630px 570px; background: #000; color: #fff; font-family: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; }
  img { display: block; width: 630px; height: 630px; object-fit: cover; }
  .side { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; }
  h1 { font-size: 64px; font-weight: 500; line-height: 1; }
  p { margin-top: 16px; font-size: 28px; color: #9a9a9a; }
  .domain { position: absolute; left: 64px; bottom: 40px; font-size: 20px; color: #9a9a9a; }
</style>
</head>
<body>
  <img src="../public/art/klimt-attersee-1280.webp" alt="" />
  <div class="side">
    <h1>spinlock</h1>
    <p>Irdi Zeneli, harness and AI infra engineer</p>
    <div class="domain">irdizeneli.dev</div>
  </div>
</body>
</html>
