# Every project and milestone on /projects, keyed by slug. Order on the page comes from `date`.
#
# Keep every line honest: no entry may claim more than its repo, readme or cv says.
# Stats (my commits, active days, languages) come from src/data/project-stats.json, keyed by slug.
# Refresh them with `npm run project-stats`. Work that is not on GitHub uses `manual`.
#
# fields
#   name, date, chapter, blurb          required
#   precision   day (default) | month | year: how much of `date` to show
#   type        project (default) | milestone
#   size        feature (default, big card) | bside (one compact row)
#   kind        the stamp on the card
#   stack       short stack line
#   repo        GitHub repo name(s) under IrdiZ, comma separated. Feeds the stats. The stats script
#               asks GitHub which repos are public: only those get a "github" link, every other
#               one shows an inert "private repo" stamp. Nothing to mark by hand.
#   source      a public repo that is not mine (team repos), linked as "team repo"
#   post        slug of a blog post about it
#   media       { src, alt } image, or { video, poster, alt } short muted loop, or { art } built-in drawing
#   teaser      one short line for the home page panes (only the six picked in pages/index.astro)
#   commit      a real commit message worth quoting, `commitNote` translates it
#   team        who built it with me
#   tone        milestones: start | move | win | end
#   now         still in progress
#   manual      { commits, total, lines, note } for work that is not on GitHub.
#               commits = mine, total = the whole team's

